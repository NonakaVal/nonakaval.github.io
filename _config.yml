# ============================================================================
# Site Configuration
# ============================================================================

BUNDLE_PATH: "vendor/bundle"

# Theme
theme: jekyll-theme-chirpy

# ============================================================================
# Localization
# ============================================================================

# Language
lang: pt-BR

# Timezone (e.g. America/Sao_Paulo)
timezone:

# ============================================================================
# SEO
# ============================================================================

title: "Frases sobre Frases"
tagline: "by @NonakaVal"

description: >-
  Personal Blog by @NonakaVal

url: "https://nonakaval.github.io/"
baseurl: ""

github:
  username: NonakaVal

twitter:
  username: twitter_username

social:
  name: Valdenir Nonaka
  email: valdenirnonaka@gmail.com
  links:
    - https://github.com/NonakaVal

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ============================================================================
# Analytics
# ============================================================================

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

# ============================================================================
# Appearance
# ============================================================================

theme_mode: # light | dark

cdn:

avatar: "assets/img/profile/killua.jpg"

social_preview_image:

favicon: /assets/img/favicons/favicon.ico
apple-touch-icon: /assets/img/favicons/apple-touch-icon.png

# ============================================================================
# Content
# ============================================================================

toc: true

paginate: 10

# ============================================================================
# Comments
# ============================================================================

comments:
  provider:

  disqus:
    shortname:

  utterances:
    repo:
    issue_term:

  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# ============================================================================
# Static Assets
# ============================================================================

assets:
  self_host:
    enabled:
    env:

# ============================================================================
# Progressive Web App
# ============================================================================

pwa:
  enabled: true

  cache:
    enabled: true
    deny_paths:
      # - "/example"

# ============================================================================
# Markdown
# ============================================================================

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge

  syntax_highlighter_opts:
    css_class: highlight

    span:
      line_numbers: false

    block:
      line_numbers: true
      start_line: 1

# ============================================================================
# Collections
# ============================================================================

collections:
  tabs:
    output: true
    sort_by: order

# ============================================================================
# Default Front Matter
# ============================================================================

defaults:
  - scope:
      path: ""
      type: posts

    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts

    values:
      comments: false

  - scope:
      path: ""
      type: tabs

    values:
      layout: page
      permalink: /:title/

# ============================================================================
# Sass
# ============================================================================

sass:
  style: compressed

# ============================================================================
# HTML Compression
# ============================================================================

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false

  ignore:
    envs:
      - development

# ============================================================================
# Excluded Files
# ============================================================================

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# ============================================================================
# Archives
# ============================================================================

jekyll-archives:
  enabled:
    - tags

  layouts:
    tag: tag

  permalinks:
    tag: /tags/:name/